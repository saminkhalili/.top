<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Sign in to Samin.">
  <title>Sign in — Samin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-page" id="login-screen">
    <section class="welcome-panel" aria-label="Welcome to Samin">
      <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
      <a class="brand" href="#" aria-label="Samin home"><span class="brand-mark">S</span><span>samin</span></a>
      <div class="welcome-copy">
        <h1>My website<br>to practice<br><em>front-end coding.</em></h1>
      </div>
    </section>

    <section class="form-panel" aria-label="Account sign in">
      <div class="mobile-brand"><a class="brand" href="#"><span class="brand-mark">S</span><span>samin</span></a></div>
      <div class="form-wrap">
        <div class="form-heading">
          <h2 id="form-title">Welcome.</h2>
        </div>

        <form id="login-form" novalidate>
          <div class="field-group" id="username-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>
            <span class="field-error" aria-live="polite"></span>
          </div>
          <div class="field-group" id="password-group">
            <div class="label-row"><label for="password">Password</label></div>
            <div class="password-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="show-password" type="button" aria-label="Show password">Show</button></div>
            <span class="field-error" aria-live="polite"></span>
          </div>
          <button class="submit-button" type="submit"><span id="submit-label">Enter</span><span class="button-arrow">↗</span></button>
          <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
